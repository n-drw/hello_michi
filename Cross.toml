[build]
# Mount the burn repo so path dependencies resolve
volumes = ["/Users/perro/work/burn:/Users/perro/work/burn:ro"]

[build.env]
passthrough = [
  "RUSTFLAGS",
  "RUST_LOG",
  "CARGO_BUILD_TARGET",
  "PKG_CONFIG_PATH",
  "PKG_CONFIG_ALLOW_CROSS",
]

[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:main"
pre-build = [
  "dpkg --add-architecture arm64",
  "apt-get update && apt-get install -y pkg-config libssl-dev:arm64 zlib1g-dev:arm64",
  "curl -LO https://github.com/rui314/mold/releases/download/v2.40.2/mold-2.40.2-aarch64-linux.tar.gz",
  "tar -xvf ./mold-2.40.2-aarch64-linux.tar.gz",
  "mv ./mold-2.40.2-aarch64-linux/bin/mold /usr/bin/mold",
]

[target.aarch64-unknown-linux-gnu.env]
passthrough = [
  "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig",
  "PKG_CONFIG_ALLOW_CROSS=1",
  "RUST_LOG=info",
  "BUILD_TARGET=aarch64-unknown-linux-gnu/",
  "RUST_TARGET=--target=aarch64-unknown-linux-gnu",
  "RUSTUP_TOOLCHAIN=nightly-x86_64-unknown-linux-gnu",
  "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc",
  "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++",
  "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc",
  "BINDGEN_EXTRA_CLANG_ARGS=--sysroot=/usr/aarch64-linux-gnu/include",

]
